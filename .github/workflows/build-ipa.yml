name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Xcode Project
      run: |
        mkdir -p output-app
        echo "=== Building 3105-main Project ==="
        
        xcodebuild build \
          -project "3105-main/ThreeOneOSFive.xcodeproj" \
          -alltargets \
          -configuration Release \
          -sdk iphoneos \
          CONFIGURATION_BUILD_DIR=$PWD/output-app \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find output-app -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "App not found"
          exit 1
        fi
        cp -r "$APP_PATH" Payload/
        zip -r 3105-ModMenu.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-ModMenu-IPA
        path: 3105-ModMenu.ipa

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v${{ github.run_number }}
        name: 3105-ModMenu Build #${{ github.run_number }}
        files: 3105-ModMenu.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
