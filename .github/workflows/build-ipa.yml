name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build Xcode Project
      run: |
        mkdir -p output-app
        PROJECT_PATH="meo/ThreeOneOSFive.xcodeproj"
        if [ ! -d "$PROJECT_PATH" ]; then
          PROJECT_PATH="3105-main/ThreeOneOSFive.xcodeproj"
        fi
        
        xcodebuild build \
          -project "$PROJECT_PATH" \
          -alltargets \
          -configuration Release \
          -sdk iphoneos \
          CONFIGURATION_BUILD_DIR=$PWD/output-app \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find output-app -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "App not found"
          exit 1
        fi
        cp -r "$APP_PATH" Payload/
        zip -r 3105-ModMenu.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-ModMenu-IPA
        path: 3105-ModMenu.ipa

    - name: Create Password-Protected meolib.zip
      run: |
        pip install pyzipper
        python -c "
        import pyzipper, os
        with pyzipper.AESZipFile('meolib.zip', 'w', compression=pyzipper.ZIP_DEFLATED, encryption=pyzipper.WZ_AES) as z:
            z.setpassword(b'meomeo123')
            z.write('meo/ThreeOneOSFive/libmeo.a', 'libmeo.a')
            z.write('meo/ThreeOneOSFive/MeoCore.h', 'MeoCore.h')
        print('Created meolib.zip successfully, size:', os.path.getsize('meolib.zip'))
        "

    - name: Upload Encrypted meolib.zip
      uses: actions/upload-artifact@v4
      with:
        name: meolib-encrypted-zip
        path: meolib.zip
