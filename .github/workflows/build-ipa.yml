name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: |
        xcodebuild clean build \
          -project 3105-main/ThreeOneOSFive.xcodeproj \
          -alltargets \
          -configuration Release \
          -sdk iphoneos \
          CONFIGURATION_BUILD_DIR=$PWD/build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        # Find the .app folder in the build directory
        APP_PATH=$(find build -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "App not found"
          exit 1
        fi
        cp -r "$APP_PATH" Payload/
        zip -r 3105-ModMenu.ipa Payload
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-ModMenu-IPA
        path: 3105-ModMenu.ipa
