name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Prepare MeoLib Static Library (.a)
      run: |
        if [ -f "meo/ThreeOneOSFive/MeoLib/MeoCore.m" ]; then
          echo "=== Compiling MeoCore into static library libmeo.a ==="
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -O3 -c meo/ThreeOneOSFive/MeoLib/MeoCore.m -o MeoCore.o
          xcrun --sdk iphoneos libtool -static -o meo/ThreeOneOSFive/MeoLib/libmeo.a MeoCore.o
          rm -f MeoCore.o meo/ThreeOneOSFive/MeoLib/MeoCore.m
        fi
        if [ -d "3105-main/ThreeOneOSFive" ]; then
          echo "=== Syncing MeoLib to 3105-main main project ==="
          mkdir -p 3105-main/ThreeOneOSFive/MeoLib
          cp -f meo/ThreeOneOSFive/MeoLib/libmeo.a 3105-main/ThreeOneOSFive/MeoLib/libmeo.a
          cp -f meo/ThreeOneOSFive/MeoLib/MeoCore.h 3105-main/ThreeOneOSFive/MeoLib/MeoCore.h
        fi
        echo "=== MeoLib static library status ==="
        ls -la meo/ThreeOneOSFive/MeoLib/
        ls -la 3105-main/ThreeOneOSFive/MeoLib/
    
    - name: Build Xcode Project
      run: |
        mkdir -p output-app
        PROJECT_PATH="3105-main/ThreeOneOSFive.xcodeproj"
        if [ ! -d "$PROJECT_PATH" ]; then
          PROJECT_PATH="meo/ThreeOneOSFive.xcodeproj"
        fi
        echo "=== Building project from: $PROJECT_PATH ==="
        
        xcodebuild build \
          -project "$PROJECT_PATH" \
          -alltargets \
          -configuration Release \
          -sdk iphoneos \
          CONFIGURATION_BUILD_DIR=$PWD/output-app \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find output-app -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "App not found"
          exit 1
        fi
        cp -r "$APP_PATH" Payload/
        zip -r 3105-ModMenu.ipa Payload
        cp -f 3105-ModMenu.ipa MeoMeo-ModMenu.ipa
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-ModMenu-IPA
        path: 3105-ModMenu.ipa

    - name: Upload MeoLib iOS Static Library Folder
      uses: actions/upload-artifact@v4
      with:
        name: MeoLib-iOS-StaticLibrary
        path: meo/ThreeOneOSFive/MeoLib/

