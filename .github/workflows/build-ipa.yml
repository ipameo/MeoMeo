name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile MeoCore Static Library (.a)
      run: |
        echo "=== Compiling MeoCore into static library libmeo.a ==="
        xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -O3 -c meo/ThreeOneOSFive/MeoCore/MeoCore.m -o MeoCore.o
        xcrun --sdk iphoneos libtool -static -o meo/ThreeOneOSFive/libmeo.a MeoCore.o
        if [ -d "3105-main/ThreeOneOSFive" ]; then
          cp meo/ThreeOneOSFive/libmeo.a 3105-main/ThreeOneOSFive/libmeo.a
        fi
        rm -f MeoCore.o
        echo "=== Compiled libmeo.a successfully ==="
        ls -la meo/ThreeOneOSFive/libmeo.a

    - name: Build Xcode Project
      run: |
        mkdir -p output-app
        # Prefer building from separated 'meo' folder
        PROJECT_PATH="meo/ThreeOneOSFive.xcodeproj"
        if [ ! -d "$PROJECT_PATH" ]; then
          PROJECT_PATH="3105-main/ThreeOneOSFive.xcodeproj"
        fi
        
        xcodebuild build \
          -project "$PROJECT_PATH" \
          -alltargets \
          -configuration Release \
          -sdk iphoneos \
          CONFIGURATION_BUILD_DIR=$PWD/output-app \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find output-app -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "App not found"
          exit 1
        fi
        cp -r "$APP_PATH" Payload/
        zip -r 3105-ModMenu.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-ModMenu-IPA
        path: 3105-ModMenu.ipa

    - name: Upload Static Library (.a)
      uses: actions/upload-artifact@v4
      with:
        name: libmeo-static-library
        path: meo/ThreeOneOSFive/libmeo.a
